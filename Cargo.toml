[package]
name = "skynet"
version = "1.0.0"
repository = "https://github.com/SentinelMod/backend"
edition = "2021"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
panic = "abort"  # Abort on panic. This is what we want for a bot.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
serde = "1.0"
log = "0.4"
env_logger = "0.9"
sqlx = { version = "0.7", features = [ "runtime-tokio-rustls", "postgres", "chrono", "uuid", "bigdecimal", "json"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde_json = "1.0"
serde_yaml = "0.9"
once_cell = "1.17"
futures-util = "0.3"
indexmap = { version = "2.2.6", features = ["serde"] }
strum = "0.24"
strum_macros = "0.24"
rand = "0.8"
axum = "0.6"
axum-macros = "0.3"
nonmax = "0.5"
tower-http = { version = "0.3", features = ["cors"] }

[dependencies.tokio]
version = "1"
default-features = true
features = ["full"]

[dependencies.serenity]
git = "https://github.com/serenity-rs/serenity"
branch = "next"
features = ["model", "http", "cache", "rustls_backend"]

[dependencies.botox]
git = "https://github.com/infinitybotlist/botox"
branch = "main"

[build-dependencies]
vergen = "7"
anyhow = "1.0"
